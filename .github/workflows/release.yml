# separate terms of service, privacy policy, and support
# documentation.

name: Release

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: bancolombia/flutter-setup-action@v1

      - name: Install dependencies
        run: flutter pub get

      - name: build
        run: ./build.sh
